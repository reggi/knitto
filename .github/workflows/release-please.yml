name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_ref:
        description: Existing release tag to stage on npm
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        if: inputs.publish_ref == ''
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Check out released source
        if: steps.release.outputs.release_created == 'true' || inputs.publish_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_ref || steps.release.outputs.tag_name }}

      - name: Set up Node.js for npm
        if: steps.release.outputs.release_created == 'true' || inputs.publish_ref != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm 12
        if: steps.release.outputs.release_created == 'true' || inputs.publish_ref != ''
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm12" npm@12.0.2
          echo "$RUNNER_TEMP/npm12/bin" >> "$GITHUB_PATH"

      - name: Build package with npm 12
        if: steps.release.outputs.release_created == 'true' || inputs.publish_ref != ''
        run: |
          npm ci
          npm run build

      - name: Publish package on npm
        if: steps.release.outputs.release_created == 'true' || inputs.publish_ref != ''
        run: npm publish --provenance --tag latest
